name: Generate Terminal Profile

on:
  push:
    branches:
      - main
    paths:
      - "assets/ascii-art.txt"
      - "scripts/generate_terminal.py"
      - ".github/workflows/generate-terminal.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate terminal SVG
        run: python scripts/generate_terminal.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate terminal profile"
            git push
          fi
