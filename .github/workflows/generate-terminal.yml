name: Generate Terminal Profile

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "assets/ascii-art.txt"
      - "scripts/generate_terminal.py"
      - ".github/workflows/generate-terminal.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install Pillow

      - name: Generate animated terminal
        run: python scripts/generate_terminal.py

      - name: Check generated file
        run: |
          ls -lah assets
          test -f assets/terminal.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.gif

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate terminal animation"
            git push
          fi
